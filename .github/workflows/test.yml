name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # Generate the lcov SonarQube reads. `npm test` alone is `jest` with no
      # --coverage, so the coverage/ artifact uploaded below was always empty
      # and the new_coverage gate could never be evaluated from CI.
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npx playwright install --with-deps
      # The Playwright fixture loads the real unpacked extension and throws
      # "Extension not built. Run `npm run build:ext` first." when dist/
      # lacks manifest.json. This job never built it, so every e2e case failed
      # in setup while the unit jobs were the only ones reporting anything.
      # `build:ext`, not `build:all`: the e2e specs load the extension bundle
      # and no spec imports dist/src, so tsc output is not needed here.
      - run: npm run build:ext
      # Extensions do not load in Playwright's headless mode: the service
      # worker never registers and every case times out waiting for it. This
      # was masked for a while because the binary lookup failed first, so the
      # job failed for two different reasons in a row.
      #
      # `--headed` needs a display, and Linux CI has none, so xvfb provides
      # one. `--auto-servernum` picks a free display so parallel runs on the
      # same host cannot collide.
      # No xvfb and no --headed: the fixture drops Playwright's default
      # `--disable-extensions`, and with that gone the extension loads in
      # headless. An earlier attempt ran headed under xvfb and still failed,
      # because the real blocker was the flag, not the absence of a display.
      - run: npx playwright test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run benchmarks
        run: npx tsx benchmarks/domain-validation.bench.ts
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 30
