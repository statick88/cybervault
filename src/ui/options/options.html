<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberVault — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">CyberVault Settings</h1>
  </header>

  <main class="main">
    <!-- Trusted Domains -->
    <section class="section" id="trusted-domains-section">
      <h2 class="section__heading">Trusted Domains</h2>
      <p class="section__desc">Domains you have verified. AITM detection will skip exact matches.</p>

      <div class="domain-form">
        <input
          type="text"
          id="domain-input"
          class="domain-form__input"
          placeholder="example.com"
          aria-label="Domain to trust"
        />
        <button id="domain-add" class="btn btn--primary" type="button">Add</button>
      </div>

      <ul id="domain-list" class="domain-list" role="list"></ul>
    </section>

    <!-- AITM Detection Config -->
    <section class="section">
      <h2 class="section__heading">AITM Detection</h2>

      <label class="toggle-row">
        <span>Auto-validate domains</span>
        <input type="checkbox" id="cfg-auto-validate" class="toggle" />
      </label>

      <label class="toggle-row">
        <span>Block high-risk domains</span>
        <input type="checkbox" id="cfg-block-high-risk" class="toggle" />
      </label>

      <label class="toggle-row">
        <span>Show notifications</span>
        <input type="checkbox" id="cfg-show-notifications" class="toggle" />
      </label>

      <label class="field-row">
        <span>Session timeout (minutes)</span>
        <input
          type="number"
          id="cfg-session-timeout"
          class="field-row__input"
          min="1"
          max="1440"
          value="30"
        />
      </label>
    </section>

    <!-- Export / Import -->
    <section class="section">
      <h2 class="section__heading">Data</h2>

      <div class="action-row">
        <button id="export-btn" class="btn btn--primary" type="button">Export Vault</button>
        <button id="import-btn" class="btn btn--ghost" type="button">Import Vault</button>
        <input type="file" id="import-file" accept=".json" hidden />
      </div>

      <p id="data-status" class="data-status" hidden></p>
    </section>

    <!-- Anomaly Log -->
    <section class="section">
      <h2 class="section__heading">Recent Anomalies</h2>
      <ul id="anomaly-log" class="anomaly-log" role="list"></ul>
      <p id="anomaly-empty" class="data-status">No anomalies recorded.</p>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
