<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberVault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div>
      <h1 class="header__title">🛡️ CyberVault</h1>
      <div class="header__brand">ISCD Ecuador</div>
    </div>
    <button id="lock-toggle" class="header__lock" type="button" aria-label="Lock vault" hidden>
      <span class="icon" id="lock-icon">🔒</span>
    </button>
  </header>

  <!-- Login View -->
  <section id="login-view" class="view">
    <div class="login-view">
      <p class="login-view__label">Iniciar Sesión</p>
      <form id="login-form">
        <input
          type="email"
          id="login-email"
          class="login-view__input"
          placeholder="Email"
          aria-label="Email"
          required
        />
        <input
          type="password"
          id="login-password"
          class="login-view__input"
          placeholder="Contraseña"
          aria-label="Password"
          required
        />
        <button type="submit" class="btn btn--primary" id="login-btn">Iniciar Sesión</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Locked View -->
  <section id="locked-view" class="view" hidden>
    <div class="lock-view">
      <p class="lock-view__label">Vault is locked</p>
      <input
        type="password"
        id="passphrase-input"
        class="lock-view__input"
        placeholder="Enter passphrase"
        aria-label="Passphrase"
        autocomplete="off"
      />
      <button id="unlock-btn" class="btn btn--primary" type="button">Unlock</button>
      <p id="lock-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Unlocked View -->
  <section id="unlocked-view" class="view" hidden>
    <div class="toolbar">
      <input
        type="search"
        id="search-input"
        class="toolbar__search"
        placeholder="Search credentials…"
        aria-label="Search credentials"
      />
      <button id="add-btn" class="btn btn--small" type="button" aria-label="Add credential">+</button>
    </div>

    <ul id="credential-list" class="credential-list" role="list"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <p>No credentials yet.</p>
    </div>

    <!--
      R3: this panel used to ask for a PIN. There is no PIN — `createChallenge`
      generated one, discarded it, and never delivered it, so the flow was
      un-completable. The third factor is now the user's decision itself:
      Core signs the approval, Plus verifies it. The user needs to know WHICH
      credential is being released, for WHICH site, and why, because they are
      the one authorising it.
    -->
    <div id="step-up-panel" class="add-form" hidden>
      <p id="step-up-status" class="add-form__status"></p>
      <p id="step-up-detail" class="add-form__status"></p>
      <div class="add-form__actions">
        <button id="step-up-submit" class="btn btn--primary" type="button">Release</button>
        <button id="step-up-dismiss" class="btn btn--ghost" type="button">Not now</button>
      </div>
      <p id="step-up-error" class="error" hidden></p>
    </div>

    <div id="add-form" class="add-form" hidden>
      <input type="text" id="add-title" placeholder="Title" class="add-form__input" />
      <input type="text" id="add-username" placeholder="Username" class="add-form__input" />
      <input type="password" id="add-password" placeholder="Password" class="add-form__input" />
      <input type="url" id="add-url" placeholder="Origin (https://example.com)" class="add-form__input" />
      <div class="add-form__actions">
        <button id="add-save" class="btn btn--primary" type="button">Save</button>
        <button id="add-cancel" class="btn btn--ghost" type="button">Cancel</button>
      </div>
      <p id="add-error" class="error" hidden></p>
    </div>
  </section>

  <footer class="footer">
    <a id="options-link" href="#" class="footer__link">Settings</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
