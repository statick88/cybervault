# =============================================================================
# CyberVault Stack (Docker Swarm)
# =============================================================================
# Deploy: docker stack deploy -c stack.yml cybervault
# Remove: docker stack rm cybervault
# =============================================================================

version: "3.8"

services:
  # -----------------------------------------------------------------------------
  # API Server
  # -----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: cybervault-api:latest
    container_name: cybervault-api
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cybervault
      - DB_USER=cybervault
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - VAULT_ENCRYPTION_SALT=${VAULT_ENCRYPTION_SALT}
      - IPFS_ENABLED=false
      - USE_POSTGRES=true
      - DATABASE_URL=postgresql://cybervault:${POSTGRES_PASSWORD}@postgres:5432/cybervault
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homelab-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # -----------------------------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cybervault-db
    environment:
      - POSTGRES_DB=cybervault
      - POSTGRES_USER=cybervault
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybervault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab-net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # -----------------------------------------------------------------------------
  # Redis (Cache & Sessions)
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cybervault-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab-net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

# =============================================================================
# Networks
# =============================================================================
networks:
  homelab-net:
    external: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    name: cybervault-postgres
  redis-data:
    name: cybervault-redis
