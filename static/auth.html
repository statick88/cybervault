<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberVault — Login / Registro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: rgba(20, 20, 40, 0.95);
      border: 1px solid rgba(100, 100, 255, 0.15);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: #7c8aff;
      letter-spacing: -0.5px;
    }

    .logo p {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(100, 100, 255, 0.15);
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .tab:hover { color: #aaa; }

    .tab.active {
      color: #7c8aff;
      border-bottom-color: #7c8aff;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(30, 30, 60, 0.8);
      border: 1px solid rgba(100, 100, 255, 0.2);
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #7c8aff;
      box-shadow: 0 0 0 3px rgba(124, 138, 255, 0.15);
    }

    .form-group input::placeholder {
      color: #555;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #5a6aff, #7c8aff);
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4a5aef, #6c7aef);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(100, 120, 255, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background: rgba(255, 80, 80, 0.15);
      border: 1px solid rgba(255, 80, 80, 0.3);
      color: #ff6b6b;
    }

    .alert-success {
      background: rgba(80, 255, 120, 0.15);
      border: 1px solid rgba(80, 255, 120, 0.3);
      color: #6bff9a;
    }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .token-display {
      margin-top: 20px;
      padding: 14px;
      background: rgba(30, 30, 60, 0.9);
      border: 1px solid rgba(100, 255, 100, 0.2);
      border-radius: 8px;
      display: none;
    }

    .token-display h3 {
      font-size: 13px;
      color: #6bff9a;
      margin-bottom: 8px;
    }

    .token-display code {
      display: block;
      font-size: 11px;
      color: #aaa;
      word-break: break-all;
      max-height: 80px;
      overflow-y: auto;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>🔐 CyberVault</h1>
        <p>Zero-Knowledge Credential Manager</p>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="login">Iniciar Sesión</button>
        <button class="tab" data-tab="register">Registrarse</button>
      </div>

      <!-- Alert -->
      <div id="alert" class="alert"></div>

      <!-- Login Form -->
      <div id="login-panel" class="form-panel active">
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="admin@cybervault.test" required>
          </div>
          <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" id="login-btn">Iniciar Sesión</button>
        </form>
      </div>

      <!-- Register Form -->
      <div id="register-panel" class="form-panel">
        <form id="register-form">
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="user@cybervault.test" required>
          </div>
          <div class="form-group">
            <label for="register-password">Contraseña</label>
            <input type="password" id="register-password" placeholder="Mínimo 8 caracteres" required minlength="8">
          </div>
          <div class="form-group">
            <label for="register-confirm">Confirmar Contraseña</label>
            <input type="password" id="register-confirm" placeholder="Repetir contraseña" required minlength="8">
          </div>
          <button type="submit" class="btn btn-primary" id="register-btn">Crear Cuenta</button>
        </form>
      </div>

      <!-- Token Display -->
      <div id="token-display" class="token-display">
        <h3>✅ Token JWT (copia para pruebas):</h3>
        <code id="token-value"></code>
      </div>

      <div class="footer">
        API: <span id="api-url">http://localhost:3010</span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.includes('localhost')
      ? 'http://localhost:3010'
      : window.location.origin;

    // Update API URL display
    document.getElementById('api-url').textContent = API_BASE;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));

        tab.classList.add('active');
        document.getElementById(`${tab.dataset.tab}-panel`).classList.add('active');
        hideAlert();
      });
    });

    // Show/hide alerts
    function showAlert(message, type = 'error') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert alert-${type}`;
      alert.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alert').style.display = 'none';
    }

    function showToken(token) {
      const display = document.getElementById('token-display');
      document.getElementById('token-value').textContent = token;
      display.style.display = 'block';
    }

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const res = await fetch(`${API_BASE}/api/v1/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          showAlert(`✅ Login exitoso — redirigiendo...`, 'success');

          // Store in localStorage for vault access
          localStorage.setItem('cybervault_token', data.token);
          localStorage.setItem('cybervault_userId', data.userId);
          localStorage.setItem('cybervault_email', data.email);

          // Redirect to vault after short delay
          setTimeout(() => {
            window.location.href = '/vault.html';
          }, 800);
        } else {
          showAlert(data.error || 'Error al iniciar sesión');
        }
      } catch (err) {
        showAlert(`Error de conexión: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });

    // Register
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;
      const btn = document.getElementById('register-btn');

      if (password !== confirm) {
        showAlert('Las contraseñas no coinciden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const res = await fetch(`${API_BASE}/api/v1/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          showAlert(`✅ Registro exitoso — redirigiendo...`, 'success');

          // Store in localStorage
          localStorage.setItem('cybervault_token', data.token);
          localStorage.setItem('cybervault_userId', data.userId);
          localStorage.setItem('cybervault_email', data.email);

          // Redirect to vault after short delay
          setTimeout(() => {
            window.location.href = '/vault.html';
          }, 800);
        } else {
          showAlert(data.error || 'Error al registrar');
        }
      } catch (err) {
        showAlert(`Error de conexión: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear Cuenta';
      }
    });

    // Load saved token if exists
    const savedToken = localStorage.getItem('cybervault_token');
    if (savedToken) {
      showAlert('Token guardado en localStorage. Usa la consola para pruebas.', 'success');
    }
  </script>
</body>
</html>
